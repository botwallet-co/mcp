# =============================================================================
# Publish @botwallet/mcp to npm — runs in the PUBLIC repo (github.com/botwallet-co/mcp).
#
# This file is mirrored from the Botwallet monorepo (packages/mcp/.github/workflows/).
# The monorepo's `pnpm release:mcp <version>` mirrors the package here and pushes tag
# v<version>; that tag triggers this workflow, which publishes via npm trusted
# publishing (OIDC) — no npm token anywhere. The trusted publisher is configured on
# npmjs.com → @botwallet/mcp → Settings → Trusted Publisher (repo botwallet-co/mcp,
# workflow publish.yml).
# =============================================================================
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # creates the GitHub Release for the tag
  id-token: write # required for npm trusted publishing (OIDC)

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - run: npm install

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "::error::tag v$TAG but package.json is $PKG"; exit 1; }

      - run: npm run build
      - run: npm test

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@botwallet/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@botwallet/mcp@$VERSION is already on npm — nothing to do"
          else
            npm publish --access public --ignore-scripts
          fi
          echo "npm: $(npm view @botwallet/mcp version)" >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
